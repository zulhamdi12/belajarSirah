<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jom Belajar Sirah & Akhlak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4EE; --surface:#FFFFFF; --ink:#12352E; --muted:#4F6B64; --line:#CFE3D8;
  --brand:#0F6B5A; --brand-ink:#FFFFFF; --brand-shadow:#0A4A3E; --gold:#E8A317;
  --ok:#23824A; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF4D6;
  --t1:#0F6B5A; --t1-ink:#FFFFFF; --t1-sh:#0A4A3E;
  --t2:#F2B33D; --t2-ink:#3A2600; --t2-sh:#C98A17;
  --t3:#5B4BB7; --t3-ink:#FFFFFF; --t3-sh:#3F3389;
  --t4:#1F6FA8; --t4-ink:#FFFFFF; --t4-sh:#154E78;
  --t5:#D9577A; --t5-ink:#FFFFFF; --t5-sh:#A33A58;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1E26; --surface:#16303A; --ink:#EAF4EE; --muted:#A9C2BB; --line:#26474F;
    --brand:#2FA58A; --brand-ink:#04160F; --brand-shadow:#1B6B59; --gold:#F2C14E;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#38301A;
    --t1:#1F8F77; --t1-sh:#136152; --t2:#E6A82E; --t2-ink:#2A1B00; --t2-sh:#A8771A;
    --t3:#6E5FD0; --t3-sh:#4A3EA0; --t4:#2C83C2; --t4-sh:#1C5A88; --t5:#D65F80; --t5-sh:#9C3C58;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1E26; --surface:#16303A; --ink:#EAF4EE; --muted:#A9C2BB; --line:#26474F;
  --brand:#2FA58A; --brand-ink:#04160F; --brand-shadow:#1B6B59; --gold:#F2C14E;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#38301A;
  --t1:#1F8F77; --t1-sh:#136152; --t2:#E6A82E; --t2-ink:#2A1B00; --t2-sh:#A8771A;
  --t3:#6E5FD0; --t3-sh:#4A3EA0; --t4:#2C83C2; --t4-sh:#1C5A88; --t5:#D65F80; --t5-sh:#9C3C58;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45}
.wrap{max-width:740px;margin:0 auto;padding:14px 18px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img,svg{max-width:100%}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:6px}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}

.hero{position:relative;text-align:center;padding:18px 0 4px}
.hero > svg{position:absolute;left:50%;top:44px;width:min(230px,62vw);height:auto;transform:translateX(-50%);opacity:.2;pointer-events:none}
.hero h1{position:relative;margin:0;font-size:clamp(34px,8.5vw,54px);line-height:1.02;font-weight:800;color:var(--brand)}
.greet{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:14px}
.greet .mascot{width:112px;animation:idle 3.5s ease-in-out infinite}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;max-width:270px;text-align:left;font-size:17px;line-height:1.35;margin-bottom:34px}
.bubble b{color:var(--brand)}
.namecard{display:flex;flex-direction:column;gap:8px;text-align:left}
.namecard label{font-weight:700}
.namecard input{font:inherit;font-size:19px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

.levels{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px;max-width:360px;margin:6px auto 22px}
.levels button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:700;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.games{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:600px){.games{grid-template-columns:1fr 1fr}.tile.wide{grid-column:1/-1}}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:22px;padding:16px 18px;background:var(--tc);color:var(--tink);box-shadow:0 5px 0 var(--tsh);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tsh)}
.tile.t1{--tc:var(--t1);--tink:var(--t1-ink);--tsh:var(--t1-sh)}
.tile.t2{--tc:var(--t2);--tink:var(--t2-ink);--tsh:var(--t2-sh)}
.tile.t3{--tc:var(--t3);--tink:var(--t3-ink);--tsh:var(--t3-sh)}
.tile.t4{--tc:var(--t4);--tink:var(--t4-ink);--tsh:var(--t4-sh)}
.tile.t5{--tc:var(--t5);--tink:var(--t5-ink);--tsh:var(--t5-sh)}
.tile .ico{font-size:40px;line-height:1;flex:none}
.tile h2{margin:0;font-size:23px;line-height:1.1}
.tile p{margin:3px 0 0;font-size:15.5px;opacity:.93;line-height:1.3}
.tile .best{margin-left:auto;font-size:14px;white-space:nowrap;flex:none;text-align:right}
.tile .best .off{opacity:.3;filter:grayscale(1)}
.tile .thumb{width:110px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;flex:none;border:3px solid rgba(255,255,255,.5)}
.tile .thumb svg{display:block;width:100%;height:100%}
@media (max-width:420px){.tile .thumb{width:82px}.tile{padding:14px}.tile .ico{font-size:34px}.tile h2{font-size:21px}}

.badges{margin-top:30px}
.badges h3{margin:0 0 10px;font-size:22px;color:var(--brand)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.badge{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;font-size:14px;line-height:1.2;font-weight:700}
.badge .bm{display:block;font-size:32px;margin-bottom:4px}
.badge small{display:block;font-weight:500;color:var(--muted);margin-top:3px;font-size:12.5px}
.badge.locked{opacity:.65}
.badge.got{border-color:var(--gold);background:var(--note)}
.foot{margin-top:26px;color:var(--muted);font-size:15px;text-align:center}

.gamehead{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.gamehead h2{margin:0;font-size:23px;flex:1;color:var(--brand);line-height:1.15}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

.scene{border-radius:18px;overflow:hidden;aspect-ratio:16/9;margin:0 0 16px;background:#1A244F}
.scene.short{aspect-ratio:2/1}
.scene svg{display:block;width:100%;height:100%}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qnum{color:var(--muted);font-size:16px;margin:0}
.tools{display:flex;gap:8px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.pill:disabled{opacity:.4}
.qtext{font-size:clamp(21px,4.8vw,27px);font-weight:700;line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:11px 14px;text-align:left;font-size:19px;font-weight:600;line-height:1.3;transition:opacity .25s}
.opt .k{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none;font-size:16px;font-weight:800}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.gone{opacity:.25;text-decoration:line-through}

.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:76px}
.feedback strong{display:block;font-size:21px}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}

/* Story */
.storytext{font-size:clamp(20px,4.4vw,24px);font-weight:600;line-height:1.45;margin:0 0 16px;min-height:4.4em}
.storynav{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.storynav .primary,.storynav .secondary{margin:0;padding:11px 6px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storynav .pill{white-space:nowrap}
.storynav .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:22px;border-radius:99px}
.slist{display:grid;gap:14px}
.sitem{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 4px 0 var(--line)}
.sitem .thumb{width:130px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;flex:none}
.sitem .thumb svg{display:block;width:100%;height:100%}
.sitem h3{margin:0;font-size:21px;line-height:1.15;color:var(--brand)}
.sitem p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.sitem .done{margin-left:auto;font-size:24px;padding-right:6px}
@media (max-width:420px){.sitem .thumb{width:96px}}

/* Akhlak swipe */
.swipe-area{position:relative;min-height:250px;display:grid;place-items:center;overflow:hidden;padding:6px 4px 12px}
.swipecard{position:relative;width:100%;max-width:440px;background:var(--surface);border:3px solid var(--line);border-radius:26px;padding:26px 20px 20px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .25s,opacity .3s;box-shadow:0 8px 0 var(--line)}
.swipecard:active{cursor:grabbing}
.swipecard .emo{font-size:72px;line-height:1;margin-bottom:8px}
.swipecard .qtext{margin:0}
.lean{position:absolute;top:12px;font-weight:800;font-size:16px;padding:2px 10px;border-radius:999px;opacity:0;transition:opacity .15s;color:#fff}
.lean.l{left:12px;background:var(--bad)}
.lean.r{right:12px;background:var(--ok)}
.swipecard[data-lean="bad"]{border-color:var(--bad)}
.swipecard[data-lean="bad"] .lean.l{opacity:1}
.swipecard[data-lean="good"]{border-color:var(--ok)}
.swipecard[data-lean="good"] .lean.r{opacity:1}
.ask{color:var(--muted);text-align:center;margin:0 0 12px;font-size:16px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf button{border:0;border-radius:18px;padding:12px 8px;font-size:20px;font-weight:800;color:#fff;line-height:1.2}
.tf button span{display:block;font-size:28px}
.tf .good{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.tf .badb{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.verdict{text-align:center;padding:10px}
.verdict .emo{font-size:56px;line-height:1}
.stamp{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:12px;font-weight:800;font-size:22px;color:#fff;transform:rotate(-4deg)}
.stamp.g{background:var(--ok)}.stamp.b{background:var(--bad)}

/* Susun */
.hint{color:var(--muted);font-size:16px;margin:-8px 0 14px}
.slots{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:14px;padding:7px 12px;line-height:1.3}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;flex:none}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);font-weight:600;animation:pop .3s ease}
.slot.filled .n{background:var(--ok);color:#fff}
@keyframes pop{50%{transform:scale(1.03)}}
.chips{display:grid;gap:8px}
.chip{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;text-align:left;font-size:18px;font-weight:600;line-height:1.3}
.chip.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Padan kad */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mgrid.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;border:0;padding:0;background:none;perspective:700px}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in,.mcard.matched .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center}
.mcard .f{background:var(--t5);box-shadow:inset 0 -5px 0 var(--t5-sh)}
.mcard .f svg{width:60%;height:auto;opacity:.75}
.mcard .b{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.mcard .b.kb{background:var(--note)}
.mcard.matched .b{border-color:var(--ok);background:var(--ok-bg)}
.mcard.matched{animation:pop .35s ease .4s}
.mgrid.g4 .mcard .b{font-size:12.5px;padding:3px}
.moves{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin-bottom:12px}

/* Result */
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.newbadge{display:inline-block;margin:6px 4px 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:2px 12px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastin .3s ease;max-width:92vw;text-align:center}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}}

.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}

/* Mascot */
.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hop .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}
@keyframes idle{50%{transform:translateY(-4px)}}

/* Scene animation */
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
.drift{animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(-70px)}to{transform:translateX(340px)}}
.fly{animation:fly 8s linear infinite}
@keyframes fly{from{transform:translate(-70px,10px)}to{transform:translate(340px,-12px)}}
.walk{animation:walk 18s linear infinite}
@keyframes walk{from{transform:translateX(-150px)}to{transform:translateX(330px)}}
.bob{animation:bob .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(4deg)}}
.wave{animation:wave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes wave{50%{transform:skewY(8deg) scaleX(.88)}}
.rise{animation:rise 4s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-150px);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain{display:none}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* =================== DATA =================== */
// a[0] ialah jawapan betul; pilihan dikocok semasa dipaparkan. s = gambar latar.
const SIRAH = [
  {l:1,s:"makkah",q:"Di manakah Nabi Muhammad SAW dilahirkan?",a:["Makkah","Madinah","Taif","Syam"],e:"Nabi Muhammad SAW dilahirkan di kota Makkah."},
  {l:1,s:"makkah",q:"Siapakah nama bapa Nabi Muhammad SAW?",a:["Abdullah","Abu Talib","Abdul Muttalib","Abu Bakar"],e:"Bapa baginda ialah Abdullah. Beliau wafat sebelum Nabi SAW dilahirkan."},
  {l:1,s:"makkah",q:"Siapakah nama ibu Nabi Muhammad SAW?",a:["Aminah","Halimatus Saadiah","Khadijah","Fatimah"],e:"Ibu baginda ialah Aminah binti Wahab."},
  {l:1,s:"kemah",q:"Siapakah ibu susuan Nabi Muhammad SAW?",a:["Halimatus Saadiah","Aminah","Aisyah","Fatimah"],e:"Halimatus Saadiah menyusukan dan menjaga Nabi SAW di kampung Bani Saad."},
  {l:1,s:"gajah",q:"Nabi Muhammad SAW dilahirkan pada tahun…",a:["Tahun Gajah","Tahun Kuda","Tahun Hijrah","Tahun Unta"],e:"Baginda lahir pada Tahun Gajah, iaitu tahun tentera bergajah Abrahah cuba menyerang Kaabah."},
  {l:1,s:"makkah",q:"Apakah gelaran Nabi SAW kerana baginda sangat jujur dan amanah?",a:["Al-Amin","As-Siddiq","Al-Faruq","Saifullah"],e:"Al-Amin bermaksud orang yang dipercayai."},
  {l:1,s:"hira",q:"Di manakah Nabi SAW menerima wahyu yang pertama?",a:["Gua Hira’","Gua Thur","Gua Kahfi","Bukit Uhud"],e:"Wahyu pertama diturunkan di Gua Hira’ yang terletak di Jabal Nur."},
  {l:1,s:"hira",q:"Malaikat manakah yang menyampaikan wahyu kepada Nabi SAW?",a:["Jibril","Mikail","Israfil","Izrail"],e:"Malaikat Jibril bertugas menyampaikan wahyu kepada para nabi dan rasul."},

let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = {
  ok:()=>tone([660,880]),
  bad:()=>tone([240,180],0.15,"triangle"),
  flip:()=>tone([520],0.06,"triangle"),

};
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if(!ttsOK) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/[“”]/g,""));
    u.lang = voice ? voice.lang : "ms-MY";
    if(voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

function head(title, done, total, back="home"){
  const bar = total ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${Math.round(done/total*100)}%"></span></div>` : "";
  return `<div class="gamehead"><button class="iconbtn" data-act="${back}" aria-label="Kembali">←</button><h2>${title}</h2>${muteBtn()}</div>${bar}`;
}

function fbHTML(ok, text, btnLabel, streak=0, act="next"){
  return `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${ok?pick(PRAISE):"Belum tepat, tak apa!"}</strong>${ok&&streak>=3?`<span class="streak">🔥 ${streak} betul berturut-turut!</span><br>`:""}${text}</div></div>
    <button class="primary" data-act="${act}">${btnLabel}</button>`;
}
function focusNext(){ const b=$("fb")&&$("fb").querySelector(".primary"); if(b) b.focus({preventScroll:true}); if(b) b.scrollIntoView({block:"nearest",behavior:"smooth"}); }

function storyAnswer(k){

function startQuiz(){
  const pool = SIRAH.filter(q=>q.l<=level);
  run = {game:"quiz", items:shuffle(pool).slice(0,10), i:0, score:0, streak:0, fifty:false};
  showQuiz();
}
function showQuiz(){
  hush();
  const q = run.items[run.i];
  run.opts = shuffle(q.a.map((t,idx)=>({t, ok:idx===0})));
  run.answered = false;
  run.say = q.q + ". " + run.opts.map((o,k)=>"ABCD"[k]+", "+o.t).join(". ");
  app.innerHTML = head("Kuiz Sirah", run.i, run.items.length) + `
    <div class="card page-in">
      <div class="scene short">${scene(q.s)}</div>
      <div class="qrow"><p class="qnum">Soalan ${run.i+1} daripada ${run.items.length}</p>
        <span class="tools">${ttsOK?`<button class="pill" data-act="say" aria-label="Dengar soalan">🔊 Dengar</button>`:""}<button class="pill" data-act="fifty" ${run.fifty?"disabled":""} aria-label="Bantuan 50:50, buang dua jawapan salah">✂️ 50:50</button></span></div>
      <p class="qtext">${q.q}</p>
      <div class="opts">${run.opts.map((o,k)=>`<button class="opt" data-act="qa" data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${o.t}</span></button>`).join("")}</div>
      <div id="fb" aria-live="polite"></div>
    </div>`;
}
function useFifty(btn){
  if(run.fifty || run.answered) return;
  run.fifty = true; btn.disabled = true;
  const wrong = shuffle(run.opts.map((o,i)=>o.ok?-1:i).filter(i=>i>=0)).slice(0,2);
  const btns = app.querySelectorAll(".opt");
  wrong.forEach(i=>{ btns[i].classList.add("gone"); btns[i].disabled=true; });
  sfx.flip();
}
function quizAnswer(k){
  if(run.answered) return; run.answered = true;
  hush();
  const btns = [...app.querySelectorAll(".opt")];
  btns.forEach(b=>b.disabled=true);
  const fiftyBtn = app.querySelector('[data-act="fifty"]'); if(fiftyBtn) fiftyBtn.disabled = true;
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  btns[right].classList.add("ok");
  if(ok){ run.score++; run.streak++; sfx.ok(); } else { run.streak=0; btns[k].classList.add("bad"); sfx.bad(); }
  const last = run.i+1 >= run.items.length;
  $("fb").innerHTML = fbHTML(ok, run.items[run.i].e, last?"Lihat keputusan":"Soalan seterusnya", run.streak);
  focusNext();
}
function quizNext(){
  run.i++;
  if(run.i < run.items.length){ showQuiz(); window.scrollTo(0,0); }
  else { const s=run.score, n=run.items.length; finish("quiz", s>=9?3:s>=7?2:s>=5?1:0, `Kamu menjawab ${s} daripada ${n} soalan dengan betul.`); }
}

function bindSwipe(card){
  let sx=0, dx=0, drag=false;
  card.addEventListener("pointerdown", e=>{ if(run.locked) return; drag=true; sx=e.clientX; dx=0; try{card.setPointerCapture(e.pointerId);}catch(_){} card.style.transition="none"; });
  card.addEventListener("pointermove", e=>{ if(!drag) return; dx=e.clientX-sx; card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; card.dataset.lean = dx>40?"good":dx<-40?"bad":""; });
  const end = ()=>{ if(!drag) return; drag=false; card.style.transition="";
    if(dx>90) akhlakAnswer(true); else if(dx<-90) akhlakAnswer(false); else { card.style.transform=""; card.dataset.lean=""; } };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}
function akhlakAnswer(chose){
  if(run.locked) return; run.locked = true;
  hush();
  const c = run.items[run.i], ok = chose===c.g;
  const card = $("sc");
  card.dataset.lean = chose?"good":"bad";
  card.style.transition = "transform .35s ease-in, opacity .35s";
  card.style.transform = `translateX(${chose?130:-130}%) rotate(${chose?18:-18}deg)`;
  card.style.opacity = "0";
  if(ok){ run.score++; run.streak++; sfx.ok(); } else { run.streak=0; sfx.bad(); }
  $("ctl").remove();
  const last = run.i+1 >= run.items.length;
  setTimeout(()=>{
    $("sa").innerHTML = `<div class="verdict page-in"><div class="emo" aria-hidden="true">${c.m}</div><p class="qtext" style="margin:6px 0 0">${c.t}</p><span class="stamp ${c.g?"g":"b"}">${c.g?"👍 Terpuji":"👎 Tercela"}</span></div>`;
    $("fb").innerHTML = fbHTML(ok, c.x, last?"Lihat keputusan":"Situasi seterusnya", run.streak);
    focusNext();
  }, 320);
}
function akhlakNext(){
  run.i++;
  if(run.i < run.items.length){ showAkhlak(); window.scrollTo(0,0); }
  else { const s=run.score, n=run.items.length; finish("akhlak", s>=9?3:s>=7?2:s>=5?1:0, `Kamu mengenal pasti ${s} daripada ${n} situasi dengan betul.`); }
}

/* =================== SUSUN PERISTIWA =================== */
function startSusun(){ run = {game:"susun", r:0, mistakes:0}; showRound(); }
function showRound(){
  hush();
  const R = ROUNDS[run.r];
  run.next = 0;
  const order = shuffle(R.items.map((t,i)=>({t,i})));
  app.innerHTML = head("Susun Peristiwa", run.r, ROUNDS.length) + `
    <div class="card page-in">
      <div class="scene short">${scene(R.sc)}</div>
      <p class="qnum">Pusingan ${run.r+1} daripada ${ROUNDS.length}</p>
      <p class="qtext">${R.title}</p>
      <p class="hint">Tekan peristiwa mengikut urutan, bermula dengan yang paling awal.</p>
      <ol class="slots">${R.items.map((_,i)=>`<li class="slot" id="s${i}"><span class="n">${i+1}</span><span class="st"></span></li>`).join("")}</ol>
      <div class="chips">${order.map(o=>`<button class="chip" data-act="chip" data-i="${o.i}">${o.t}</button>`).join("")}</div>
      <div id="fb" aria-live="polite"></div>
    </div>`;
}
function chipTap(b){
  const R = ROUNDS[run.r], i = +b.dataset.i;
  if(i===run.next){
    sfx.ok();
    const s = $("s"+i);
    s.classList.add("filled");
    s.querySelector(".st").textContent = R.items[i];
    b.remove();
    run.next++;
    if(run.next===R.items.length){
      const last = run.r+1 >= ROUNDS.length;
      $("fb").innerHTML = fbHTML(true, R.note, last?"Lihat keputusan":"Pusingan seterusnya");
      focusNext();
    } else { const nx = app.querySelector(".chip"); if(nx) nx.focus({preventScroll:true}); }
  } else {
    sfx.bad(); run.mistakes++;
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }
}
function susunNext(){
  run.r++;
  if(run.r < ROUNDS.length){ showRound(); window.scrollTo(0,0); }
  else { const m=run.mistakes; finish("susun", m<=1?3:m<=4?2:1, m===0?"Kamu menyusun semua peristiwa tanpa sebarang kesilapan.":`Kamu menyusun semua peristiwa dengan ${m} kesilapan.`); }
}

/* =================== PADAN KAD =================== */
function startPadan(){
  const n = level===1 ? 6 : 8;
  const pairs = shuffle(PAIRS).slice(0,n);
  const cards = shuffle(pairs.flatMap((p,i)=>[{id:i,t:p[0],k:"a"},{id:i,t:p[1],k:"b"}]));
  run = {game:"padan", cards, open:[], matched:0, moves:0, pairs:n, lock:false};
  showPadan();
}
function showPadan(){
  hush();
  app.innerHTML = head("Padan Kad", run.matched, run.pairs) + `
    <div class="card page-in">
      <p class="hint" style="margin:0 0 10px">Terbalikkan dua kad. Padankan nama dengan maksudnya.</p>
      <div class="moves"><span id="mv">Cubaan: 0</span><span id="mt">Pasangan: 0/${run.pairs}</span></div>
      <div class="mgrid ${run.pairs>6?"g4":""}">${run.cards.map((c,i)=>`
        <button class="mcard" data-act="card" data-i="${i}" aria-label="Kad tertutup">
          <span class="in"><span class="f">${CARD_BACK}</span><span class="b ${c.k==="b"?"kb":""}">${c.t}</span></span>
        </button>`).join("")}
      </div>
    </div>`;
}
function cardTap(b){
  if(run.lock) return;
  const i = +b.dataset.i;
  if(b.classList.contains("open") || b.classList.contains("matched")) return;
  b.classList.add("open"); b.setAttribute("aria-label", run.cards[i].t); sfx.flip();
  run.open.push(b);
  if(run.open.length<2) return;
  run.moves++; $("mv").textContent = "Cubaan: "+run.moves;
  const [x,y] = run.open; run.open = [];
  if(run.cards[+x.dataset.i].id === run.cards[+y.dataset.i].id){
    run.matched++;
    setTimeout(()=>{ x.classList.replace("open","matched"); y.classList.replace("open","matched"); x.disabled=y.disabled=true; sfx.ok(); }, 350);
    $("mt").textContent = `Pasangan: ${run.matched}/${run.pairs}`;
    const bar = app.querySelector(".progress span"); if(bar) bar.style.width = Math.round(run.matched/run.pairs*100)+"%";
    if(run.matched===run.pairs){
      const n=run.pairs, m=run.moves;
      setTimeout(()=>finish("padan", m<=n+3?3:m<=n+7?2:1, `Kamu memadankan semua ${n} pasangan dalam ${m} cubaan.`), 1100);
    }
  } else {
    run.lock = true;
    setTimeout(()=>{ sfx.bad(); }, 300);
    setTimeout(()=>{ [x,y].forEach(c=>{ c.classList.remove("open"); c.setAttribute("aria-label","Kad tertutup"); }); run.lock=false; }, 1000);
  }
}

/* =================== RESULT, BADGES =================== */
function checkBadges(){
  const fresh = [];
  BADGES.forEach(b=>{ if(!badges.includes(b.id) && b.test()){ badges.push(b.id); fresh.push(b); } });
  if(fresh.length){ save("kafa-badges", badges); fresh.forEach((b,i)=>setTimeout(()=>toast(`🏅 Lencana baharu: ${b.m} ${b.n}`), 700+i*2700)); }
  return fresh;
}
function finish(game, stars, line){
  hush();
  const prev = best[game];
  if(stars>prev){ best[game]=stars; save("kafa-best", best); }
  const fresh = checkBadges();
  const titles = ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:20px">
      ${mascot(stars>=2?"happy":"idle")}
      <div class="stars" role="img" aria-label="${stars} daripada 3 bintang">${starsHTML(stars)}</div>
      <h2>${titles[stars]}${pname&&stars>=2?", "+esc(pname)+"!":""}</h2>
      <p>${line}</p>
      ${stars>prev?`<p>Rekod baharu untuk permainan ini.</p>`:""}
      ${fresh.map(b=>`<span class="newbadge">🏅 ${b.m} ${b.n}</span>`).join("")}
      <button class="primary" data-act="again">Main lagi</button>
      <button class="secondary" data-act="home">Kembali ke menu</button>
    </div>`;
  sfx.win();
  if(stars===3) rain();
  window.scrollTo(0,0);
}
function rain(){
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["⭐","✨","🌙"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add("out"), 2200);
  setTimeout(()=>t.remove(), 2700);
}
function saveName(){
  const v = ($("nm")&&$("nm").value||"").trim();
  if(!v){ $("nm").focus(); return; }
  pname = v.slice(0,20); save("kafa-name", pname); sfx.ok(); renderHome();
}

/* =================== EVENTS =================== */
app.addEventListener("keydown", e=>{ if(e.target.id==="nm" && e.key==="Enter") saveName(); });
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  const act = b.dataset.act;
  switch(act){
    case "home": renderHome(); window.scrollTo(0,0); break;
    case "mute":
      muted = !muted; save("kafa-muted", muted);
      b.textContent = muted?"🔇":"🔊";
      b.setAttribute("aria-label", muted?"Hidupkan bunyi":"Matikan bunyi");
      if(muted) hush();
      break;
    case "savename": saveName(); break;
    case "rename": pname=""; save("kafa-name",""); renderHome(); break;
    case "level":
      level = +b.dataset.l; save("kafa-level", level);
      app.querySelectorAll('[data-act="level"]').forEach(x=>x.setAttribute("aria-pressed", String(+x.dataset.l===level)));
      break;
    case "say": if(run && run.say) speak(run.say); break;
    case "cerita": storyList(); window.scrollTo(0,0); break;
    case "story": openStory(+b.dataset.s); window.scrollTo(0,0); break;
    case "sprev": if(run.p>0){ run.p--; showStoryPage(); } break;
    case "snext": if(run.p+1 < STORIES[run.s].pages.length){ run.p++; showStoryPage(); } else showStoryQ(); window.scrollTo(0,0); break;
    case "sq": storyAnswer(+b.dataset.k); break;
    case "sdone": storyDone(); window.scrollTo(0,0); break;
    case "play-quiz": startQuiz(); window.scrollTo(0,0); break;
    case "play-akhlak": startAkhlak(); window.scrollTo(0,0); break;
    case "play-susun": startSusun(); window.scrollTo(0,0); break;
    case "play-padan": startPadan(); window.scrollTo(0,0); break;
    case "qa": quizAnswer(+b.dataset.k); break;
    case "fifty": useFifty(b); break;
    case "akb": akhlakAnswer(b.dataset.v==="1"); break;
    case "chip": chipTap(b); break;
    case "card": cardTap(b); break;
    case "next":
      if(run.game==="quiz") quizNext();
      else if(run.game==="akhlak") akhlakNext();
      else if(run.game==="susun") susunNext();
      break;
    case "again":
      ({quiz:startQuiz, akhlak:startAkhlak, susun:startSusun, padan:startPadan})[run.game]();
      window.scrollTo(0,0);
      break;
  }
});

renderHome();
</script>
